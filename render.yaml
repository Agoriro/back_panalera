databases:
  - name: panalera-db
    databaseName: panalera_db
    user: panalera_user
    plan: free
    ipAllowList: []

services:
  - type: web
    name: panalera-backend
    runtime: python
    plan: free
    buildCommand: "pip install poetry && poetry config virtualenvs.create false && poetry install --only main"
    startCommand: "alembic upgrade head && python seed_db.py && uvicorn src.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: panalera-db
          property: connectionString


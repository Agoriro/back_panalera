# Paso 1: pyproject.toml
[tool.poetry]
name = "panalera-backend"
version = "0.1.0"
description = "Backend para la gestión de inventario y ventas de Panalera"
authors = ["Admin <admin@panalera.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
fastapi = "0.111.1"
uvicorn = {extras = ["standard"], version = "0.30.6"}
sqlalchemy = "2.0.52"
asyncpg = "0.30.0"
alembic = "1.19.1"
pydantic = "2.13.4"
pydantic-settings = "2.15.0"
passlib = {extras = ["bcrypt"], version = "1.7.4"}
python-jose = {extras = ["cryptography"], version = "3.5.0"}
structlog = "24.4.0"
slowapi = "0.1.10"

[tool.poetry.group.dev.dependencies]
aiosqlite = "0.20.0"
pytest = "8.4.2"
pytest-asyncio = "0.23.8"
pytest-cov = "5.0.0"
httpx = "0.27.2"
ruff = "0.4.10"
mypy = "1.20.2"
pre-commit = "3.8.0"
bandit = "1.9.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-arg",
    "no-any-return",
    "override",
    "prop-decorator",
    "return-value",
    "type-arg",
    "var-annotated",
]
exclude = ["tests/", "docker/", "alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Please use `import python_multipart` instead:PendingDeprecationWarning:starlette.formparsers",
]

# Paso 4: docker/docker-compose.yml
version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: panalera_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dbname
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d dbname"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: panalera_api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app/src
      - ../alembic.ini:/app/alembic.ini
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

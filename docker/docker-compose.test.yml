# Paso 4: docker/docker-compose.test.yml
version: '3.8'

services:
  db_test:
    image: postgres:16-alpine
    container_name: panalera_db_test
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_dbname
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_dbname"]
      interval: 5s
      timeout: 5s
      retries: 5
